      string: '{"type": "object", "properties": {"isJobResourceVend": {"title": "Job
        Resource", "type": "boolean", "description": "Check this box to enable this
        vendor to be chosen as a resource on tasks and jobs. As a job resource, a
        vendor can be assigned to complete a task or to manage a project. Clear this
        box if you do not want this vendor assigned as a job resource. Note: If you
        use NetSuite OneWorld, you cannot share a vendor with multiple subsidiaries
        and define the vendor as a resource on tasks and jobs."}, "externalId": {"title":
        "External ID", "type": "string", "description": "Returns the vendor&apos;s
        external ID, if one is assigned.", "nullable": true}, "emailTransactions":
        {"title": "Email Transactions", "type": "boolean", "description": "Set a preferred
        transaction delivery method for this vendor. Choose to send transactions by
        regular mail, by email, by fax, or by a combination of the three. Then, when
        you select the vendor on a transaction, their preferred delivery method is
        marked by default. * Email \u2013 Check this box to check the To Be Emailed
        box by default on transactions when this vendor is selected. * Print \u2013
        Check this box to check the To Be Printed box by default on transactions when
        this vendor is selected. * Fax \u2013 Check this box to check the To Be Faxed
        box by default on transactions when this vendor is selected. Once you enter
        these settings on the vendor record, these boxes are checked by default for
        transactions created from the vendor record or for transactions that are copied
        or converted. Note: These settings override any customized settings on transaction
        forms you use. There are also preferences to set default values for new vendor
        records at Setup &gt; Company &gt; Printing, Fax and Email Preferences. On
        the Print subtab, Fax subtab, or Email subtab, check Vendors Default to [Print/Fax/Email]
        Transactions. You can also set these fields using the Mass Update function.
        Go to Lists &gt; Mass Update &gt; Mass Updates &gt; General and click Vendor."},
        "entityId": {"title": "Entity ID", "type": "string", "description": "In the
        Supplier ID field, enter your supplier&apos;s name as it should appear in
        all lists. If you use Auto-Generated Numbering, this field fills with the
