- request:
    body: '{"q": "SELECT transactionline.item AS item, transactionline.quantity AS
      quantity, transactionline.rate AS rate, transactionline.linesequencenumber AS
      linesequencenumber, transactionline.matchbilltoreceipt AS matchbilltoreceipt,
      transactionline.isbillable AS isbillable, transactionline.processedbyrevcommit
      AS processedbyrevcommit, transactionline.foreignamountunpaid AS foreignamountunpaid,
      TO_CHAR (transactionline.closedate, ''YYYY-MM-DD HH24:MI:SS'') AS closedate,
      transactionline.quantityrejected AS quantityrejected, transactionline.isfullyshipped
      AS isfullyshipped, transactionline.periodclosed AS periodclosed, TO_CHAR (transactionline.linecreateddate,
      ''YYYY-MM-DD HH24:MI:SS'') AS linecreateddate, transactionline.department AS
      department, transactionline.hasfulfillableitems AS hasfulfillableitems, transactionline.mainline
      AS mainline, transactionline.foreignamountpaidnopost AS foreignamountpaidnopost,
      transactionline.documentnumber AS documentnumber, transactionline.class AS class,
      transactionline.iscogs AS iscogs, transactionline.taxline AS taxline, transactionline.expenseaccount
      AS expenseaccount, transactionline.netamount AS netamount, transactionline.fxamountlinked
      AS fxamountlinked, transactionline.memo AS memo, transactionline.cleared AS
      cleared, transactionline.isclosed AS isclosed, transactionline.hascostline AS
      hascostline, transactionline.donotprintline AS donotprintline, transactionline.commitmentfirm
      AS commitmentfirm, TO_CHAR (transactionline.duedate, ''YYYY-MM-DD HH24:MI:SS'')
      AS duedate, transactionline.creditforeignamount AS creditforeignamount, transactionline.id
      AS id, transactionline.quantityshiprecv AS quantityshiprecv, transactionline.location
      AS location, transactionline.createdfrom AS createdfrom, transactionline.foreignamountpaid
      AS foreignamountpaid, transactionline.kitcomponent AS kitcomponent, TO_CHAR
      (transactionline.linelastmodifieddate, ''YYYY-MM-DD HH24:MI:SS'') AS linelastmodifieddate,
      transactionline.accountinglinetype AS accountinglinetype, transactionline.subsidiary
      AS subsidiary, transactionline.isfxvariance AS isfxvariance, transactionline.quantitybilled
      AS quantitybilled, transactionline.debitforeignamount AS debitforeignamount,
      transactionline.oldcommitmentfirm AS oldcommitmentfirm, transactionline.foreignamount
      AS foreignamount, transactionline.isinventoryaffecting AS isinventoryaffecting,
      transactionline.transactiondiscount AS transactiondiscount, transactionline.transaction
      AS transaction, transactionline.donotdisplayline AS donotdisplayline, transactionline.uniquekey
      AS uniquekey, transactionline.entity AS entity FROM transactionline  WHERE mainline
      = ''F'' AND (hascostline = ''T'' OR accountinglinetype = ''EXPENSE'') and transaction
      IN (''21144'', ''21347'', ''21448'', ''21548'') "}'
