      duedate,TO_CHAR (transaction.enddate, ''YYYY-MM-DD HH24:MI:SS'') AS enddate,TO_CHAR
      (transaction.actualshipdate, ''YYYY-MM-DD HH24:MI:SS'') AS actualshipdate,TO_CHAR
      (transaction.closedate, ''YYYY-MM-DD HH24:MI:SS'') AS closedate,TO_CHAR (transaction.shipdate,
      ''YYYY-MM-DD HH24:MI:SS'') AS shipdate,TO_CHAR (transaction.prevdate, ''YYYY-MM-DD
      HH24:MI:SS'') AS prevdate,TO_CHAR (transaction.createddate, ''YYYY-MM-DD HH24:MI:SS'')
      AS createddate,TO_CHAR (transaction.startdate, ''YYYY-MM-DD HH24:MI:SS'') AS
      startdate,TO_CHAR (transaction.trandate, ''YYYY-MM-DD HH24:MI:SS'') AS trandate,TO_CHAR
      (transaction.lastmodifieddate, ''YYYY-MM-DD HH24:MI:SS'') AS lastmodifieddate,TO_CHAR
      (transaction.discountdate, ''YYYY-MM-DD HH24:MI:SS'') AS discountdate,TO_CHAR
      (transaction.taxpointdate, ''YYYY-MM-DD HH24:MI:SS'') AS taxpointdate,TO_CHAR
      (transaction.nextbilldate, ''YYYY-MM-DD HH24:MI:SS'') AS nextbilldate,TO_CHAR
      (transaction.duedate, ''YYYY-MM-DD HH24:MI:SS'') AS duedate,TO_CHAR (transaction.enddate,
      ''YYYY-MM-DD HH24:MI:SS'') AS enddate,TO_CHAR (transaction.actualshipdate, ''YYYY-MM-DD
      HH24:MI:SS'') AS actualshipdate,TO_CHAR (transaction.closedate, ''YYYY-MM-DD
      HH24:MI:SS'') AS closedate,TO_CHAR (transaction.shipdate, ''YYYY-MM-DD HH24:MI:SS'')
      AS shipdate,TO_CHAR (transaction.prevdate, ''YYYY-MM-DD HH24:MI:SS'') AS prevdate,TO_CHAR
      (transaction.createddate, ''YYYY-MM-DD HH24:MI:SS'') AS createddate,TO_CHAR
      (transaction.startdate, ''YYYY-MM-DD HH24:MI:SS'') AS startdate,TO_CHAR (transaction.trandate,
      ''YYYY-MM-DD HH24:MI:SS'') AS trandate,TO_CHAR (transaction.lastmodifieddate,
      ''YYYY-MM-DD HH24:MI:SS'') AS lastmodifieddate, BUILTIN.DF(status) status FROM
      transaction  WHERE transaction.lastmodifieddate>TO_TIMESTAMP(''2025-02-13 00:00:00'',
