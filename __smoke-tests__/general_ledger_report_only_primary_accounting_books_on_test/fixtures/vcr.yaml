- request:
    body: '{"q": "SELECT Account.accountsearchdisplayname as split, Account.displaynamewithhierarchy
      as categories, Account.accttype, Account.acctnumber as num, Account.id as accountid,
      Entity.altname as name, Entity.firstname, Entity.lastname, Entity.id as entityid,
      Entity.Type as entitytype, (Transaction.id || ''_'' || TransactionLine.id) AS
      id, Transaction.tranid, Transaction.externalid, Transaction.abbrevtype as transactiontype,
      TO_CHAR(Transaction.TranDate, ''YYYY-MM-DD HH24:MI:SS'') as date, Transaction.transactionnumber,
      Transaction.trandisplayname, Transaction.memo as memo, Transaction.journaltype,
      TransactionLine.memo as linememo, AccountingBook.id as accountingbook, CASE
      WHEN TransactionAccountingLine.credit IS NOT NULL THEN ''Credit'' ELSE ''Debit''
      END entrytype, TransactionAccountingLine.amount, TransactionAccountingLine.credit
      creditamount, TransactionAccountingLine.debit debitamount, department.id as
      departmentid, department.fullname as department, TransactionLine.location as
      locationid, Location.name as locationname, Subsidiary.currency currencyid, Currency.name
      as currency, Currency.symbol as currencysymbol, Transaction.currency as transactioncurrencyid,
      TransactionAccountingLine.exchangeRate as exchangerate, TransactionLine.subsidiary
      as subsidiaryid, Subsidiary.fullname as subsidiary, Classification.id as classid,
      Classification.name as class, CASE WHEN Transaction.TranDate BETWEEN AccountingPeriod.StartDate
      AND AccountingPeriod.EndDate THEN TO_CHAR(Transaction.TranDate, ''YYYY-MM-DD
      HH24:MI:SS'') ELSE TO_CHAR(AccountingPeriod.StartDate, ''YYYY-MM-DD HH24:MI:SS'')
      END AS postingDate, Transaction.postingperiod, AccountingPeriod.periodname,
      TO_CHAR(AccountingPeriod.StartDate, ''YYYY-MM-DD HH24:MI:SS'') as startdate,
      TO_CHAR(AccountingPeriod.EndDate, ''YYYY-MM-DD HH24:MI:SS'') as enddate FROM
      Transaction INNER JOIN TransactionLine ON (TransactionLine.transaction = Transaction.id)
      INNER JOIN TransactionAccountingLine ON (TransactionAccountingLine.Transaction
      = Transaction.id AND TransactionAccountingLine.TransactionLine = TransactionLine.id)
      LEFT JOIN AccountingBook ON AccountingBook.id = TransactionAccountingLine.accountingBook
      LEFT JOIN department ON (TransactionLine.department = department.id) INNER JOIN
      Account ON (Account.id = TransactionAccountingLine.account) INNER JOIN AccountingPeriod
      ON (AccountingPeriod.id = Transaction.postingperiod) LEFT JOIN Entity ON (Transaction.entity
      = Entity.id) LEFT JOIN subsidiary ON (Transactionline.subsidiary = Subsidiary.id)
      INNER JOIN Currency ON (Currency.ID = Subsidiary.Currency) LEFT JOIN Classification
      ON (Transactionline.class = Classification.id) LEFT JOIN Location ON (Transactionline.location
      = Location.id) WHERE ( Transaction.TranDate BETWEEN TO_DATE( ''2025-03-08'',
      ''YYYY-MM-DD'' ) AND TO_DATE( ''2025-03-18'', ''YYYY-MM-DD'' ) ) AND ( Transaction.Posting
      = ''T'' ) AND TransactionAccountingLine.amount !=0 AND AccountingBook.isprimary
      = ''T'' ORDER BY Transaction.TranDate DESC"}'
