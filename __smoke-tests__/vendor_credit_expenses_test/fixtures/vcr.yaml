- request:
    body: '{"q": "SELECT  tl.*,TO_CHAR (tl.closedate, ''YYYY-MM-DD HH24:MI:SS'') AS
      closedate,TO_CHAR (tl.linecreateddate, ''YYYY-MM-DD HH24:MI:SS'') AS linecreateddate,TO_CHAR
      (tl.duedate, ''YYYY-MM-DD HH24:MI:SS'') AS duedate,TO_CHAR (tl.linelastmodifieddate,
      ''YYYY-MM-DD HH24:MI:SS'') AS linelastmodifieddate,t.recordtype,TO_CHAR (tl.closedate,
      ''YYYY-MM-DD HH24:MI:SS'') AS closedate,TO_CHAR (tl.linecreateddate, ''YYYY-MM-DD
      HH24:MI:SS'') AS linecreateddate,TO_CHAR (tl.duedate, ''YYYY-MM-DD HH24:MI:SS'')
      AS duedate,TO_CHAR (tl.linelastmodifieddate, ''YYYY-MM-DD HH24:MI:SS'') AS linelastmodifieddate
      FROM transaction t INNER JOIN transactionline tl on tl.transaction = t.id WHERE
      mainline = ''F'' and accountinglinetype is NULL and tl.transaction IN (''21144'',
      ''21347'', ''21448'', ''21548'') "}'
    headers:
      Accept:
      - !!binary |
        Ki8q
      Content-Type:
      - !!binary |
        YXBwbGljYXRpb24vanNvbg==
      Prefer:
      - !!binary |
        dHJhbnNpZW50
