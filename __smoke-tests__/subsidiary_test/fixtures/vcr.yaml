- request:
    body: '{"q": "SELECT subsidiary.isinactive AS isinactive, subsidiary.country AS
      country, subsidiary.legalname AS legalname, TO_CHAR (subsidiary.lastmodifieddate,
      ''YYYY-MM-DD HH24:MI:SS'') AS lastmodifieddate, subsidiary.url AS url, subsidiary.iselimination
      AS iselimination, subsidiary.name AS name, subsidiary.state AS state, subsidiary.id
      AS id, subsidiary.fullname AS fullname, subsidiary.email AS email, subsidiary.mainaddress
      AS mainaddress, subsidiary.parent AS parent, subsidiary.returnaddress AS returnaddress,
      subsidiary.shippingaddress AS shippingaddress, subsidiary.currency AS currency
      FROM subsidiary  WHERE subsidiary.lastmodifieddate>TO_TIMESTAMP(''2000-01-01
      00:00:00'', ''YYYY-MM-DD HH24:MI:SS'') ORDER BY subsidiary.lastmodifieddate"}'
