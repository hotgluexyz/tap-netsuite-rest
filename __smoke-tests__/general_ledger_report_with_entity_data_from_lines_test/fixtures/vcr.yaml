- request:
    body: '{"q": "SELECT Account.accountsearchdisplayname as split, Account.displaynamewithhierarchy
      as categories, Account.accttype, Account.acctnumber as num, Account.id as accountid,
      COALESCE(HeaderEntity.altname, LineEntity.altname) as name, COALESCE(HeaderEntity.firstname,
      LineEntity.firstname) as firstname, COALESCE(HeaderEntity.lastname, LineEntity.lastname)
      as lastname, COALESCE(HeaderEntity.id, LineEntity.id) as entityid, COALESCE(HeaderEntity.Type,
      LineEntity.Type) as entitytype, (Transaction.id || ''_'' || TransactionLine.id)
      AS id, Transaction.tranid, Transaction.externalid, Transaction.abbrevtype as
      transactiontype, TO_CHAR(Transaction.TranDate, ''YYYY-MM-DD HH24:MI:SS'') as
      date, Transaction.transactionnumber, Transaction.trandisplayname, Transaction.memo
      as memo, Transaction.journaltype, TransactionLine.memo as linememo, AccountingBook.id
      as accountingbook, CASE WHEN TransactionAccountingLine.credit IS NOT NULL THEN
      ''Credit'' ELSE ''Debit'' END entrytype, TransactionAccountingLine.amount, TransactionAccountingLine.credit
      creditamount, TransactionAccountingLine.debit debitamount, department.id as
      departmentid, department.fullname as department, TransactionLine.location as
      locationid, Location.name as locationname, Subsidiary.currency currencyid, Currency.name
      as currency, Currency.symbol as currencysymbol, Transaction.currency as transactioncurrencyid,
      TransactionAccountingLine.exchangeRate as exchangerate, TransactionLine.subsidiary
      as subsidiaryid, Subsidiary.fullname as subsidiary, Classification.id as classid,
      Classification.name as class, CASE WHEN Transaction.TranDate BETWEEN AccountingPeriod.StartDate
      AND AccountingPeriod.EndDate THEN TO_CHAR(Transaction.TranDate, ''YYYY-MM-DD
      HH24:MI:SS'') ELSE TO_CHAR(AccountingPeriod.StartDate, ''YYYY-MM-DD HH24:MI:SS'')
      END AS postingDate, Transaction.postingperiod, AccountingPeriod.periodname,
      TO_CHAR(AccountingPeriod.StartDate, ''YYYY-MM-DD HH24:MI:SS'') as startdate,
      TO_CHAR(AccountingPeriod.EndDate, ''YYYY-MM-DD HH24:MI:SS'') as enddate, ''BK-Cust-Segment''
      as custom_segment_cseg1, TransactionLine.cseg1 as cseg1_value_id, BUILTIN.DF(
      TransactionLine.cseg1 ) as cseg1_value_name, ''Distribution Channel'' as custom_segment_csegdist_channel,
      TransactionLine.csegdist_channel as csegdist_channel_value_id, BUILTIN.DF( TransactionLine.csegdist_channel
      ) as csegdist_channel_value_name, ''Test Vini Custom Segment'' as custom_segment_csegtest_vini,
      TransactionLine.csegtest_vini as csegtest_vini_value_id, BUILTIN.DF( TransactionLine.csegtest_vini
      ) as csegtest_vini_value_name FROM Transaction INNER JOIN TransactionLine ON
      (TransactionLine.transaction = Transaction.id) INNER JOIN TransactionAccountingLine
      ON (TransactionAccountingLine.Transaction = Transaction.id AND TransactionAccountingLine.TransactionLine
      = TransactionLine.id) LEFT JOIN AccountingBook ON AccountingBook.id = TransactionAccountingLine.accountingBook
      LEFT JOIN department ON (TransactionLine.department = department.id) INNER JOIN
      Account ON (Account.id = TransactionAccountingLine.account) INNER JOIN AccountingPeriod
      ON (AccountingPeriod.id = Transaction.postingperiod) LEFT JOIN Entity AS HeaderEntity
      ON (Transaction.entity = HeaderEntity.id) LEFT JOIN Entity AS LineEntity ON
      (TransactionLine.entity = LineEntity.id) LEFT JOIN subsidiary ON (Transactionline.subsidiary
      = Subsidiary.id) INNER JOIN Currency ON (Currency.ID = Subsidiary.Currency)
      LEFT JOIN Classification ON (Transactionline.class = Classification.id) LEFT
      JOIN Location ON (Transactionline.location = Location.id) WHERE ( Transaction.TranDate
      BETWEEN TO_DATE( ''2025-12-01'', ''YYYY-MM-DD'' ) AND TO_DATE( ''2026-01-10'',
      ''YYYY-MM-DD'' ) ) AND ( Transaction.Posting = ''T'' ) AND TransactionAccountingLine.amount
      !=0 ORDER BY Transaction.TranDate DESC, Transaction.id ASC, TransactionLine.id
      ASC, TransactionAccountingLine.accountingBook ASC"}'
    headers:
      Accept:
      - !!binary |
        Ki8q
      Content-Type:
      - !!binary |
        YXBwbGljYXRpb24vanNvbg==
      Prefer:
      - !!binary |
        dHJhbnNpZW50
