name: Smoke Test

on:
  repository_dispatch:
    types: [smoke_test]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tap and smoke harness
        run: |
          python -m venv .venv
          .venv/bin/pip install . "hotglue-smoke-test==1.1.8"
      - name: Replay colocated scrubbed fixtures
        run: .venv/bin/hotglue-smoke-test run
